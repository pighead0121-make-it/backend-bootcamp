services:
  book-api:
    build: .
    image: book-api-multi
    container_name: book-api-multi-container 
    ports:
      - "3000:8080"
    environment:
      - "DB_HOST=postgres"
      - "DB_PORT=5432"
      - "DB_USER=bookuser"
      - "DB_PASSWORD=bookpass"
      - "DB_NAME=bookdb"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      - "POSTGRES_USER=bookuser"
      - "POSTGRES_PASSWORD=bookpass"
      - "POSTGRES_DB=bookdb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookdb"]
      interval: 2s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

